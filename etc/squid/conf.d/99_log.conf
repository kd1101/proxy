#
# Log settings
#
# 1 timestamp
# 2 client_ip
# 3 username
# 4 method
# 5 url
# 6 http_status
# 7 squid_status
# 8 bytes
# 9 response_time_ms
# 10 hierarchy/upstream

logformat vector %ts.%03tu|%>a|%un|%rm|%ru|%>Hs|%Ss|%<st|%tr|%Sh/%<A

access_log daemon:/var/log/squid/access.log vector

# External log rotation must be configured on the Docker host.
logfile_rotate 0